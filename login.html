<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大五人格養老">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>登入 · 大五人格高端養老評估</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f3ee;
    --ink: #1c1510;
    --ink2: #3a2e24;
    --ink3: #6b5c4e;
    --gold: #b8860b;
    --gold2: #d4a017;
    --crimson: #8b2635;
    --shadow: 0 4px 24px rgba(28,21,16,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 10% 0%, rgba(184,134,11,0.06) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(46,125,94,0.05) 0%, transparent 45%),
      linear-gradient(180deg, #f7f3ee 0%, #ffffff 30%, #f7f3ee 100%);
    pointer-events: none;
    z-index: 0;
  }
  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border: 1px solid rgba(184,134,11,0.25);
    border-radius: 16px;
    padding: 36px 28px;
    box-shadow: var(--shadow);
  }
  .header { text-align: center; margin-bottom: 28px; }
  .logo-text {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 2.2rem;
    color: var(--gold);
    letter-spacing: 0.1em;
  }
  .logo-sub {
    font-size: 0.78rem;
    color: var(--ink3);
    margin-top: 6px;
    letter-spacing: 0.15em;
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink3);
    margin-bottom: 7px;
    letter-spacing: 0.1em;
  }
  .form-input {
    width: 100%;
    padding: 13px 16px;
    background: #ffffff;
    border: 1.5px solid #ddd5c8;
    border-radius: 10px;
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--gold2);
    box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
  }
  .btn-primary {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 100%);
    border: none;
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(184,134,11,0.35);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .msg {
    font-size: 0.82rem;
    text-align: center;
    margin-top: 14px;
    min-height: 1.2em;
  }
  .msg.error { color: var(--crimson); }
  .msg.ok { color: #2e7d5e; }
</style>
</head>
<body>

<div class="login-card">
  <div class="header">
    <div class="logo-text">大五人格</div>
    <div class="logo-sub">高端養老評估 · 管理登入</div>
  </div>

  <form id="login-form" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label class="form-label">電子郵件</label>
      <input class="form-input" type="email" id="f-email" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label">密碼</label>
      <input class="form-input" type="password" id="f-password" autocomplete="current-password" required>
    </div>
    <button class="btn-primary" id="btn-login" type="submit">登入</button>
    <div class="msg" id="login-msg"></div>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://txvyplfaaisrzbwpoqcd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ZgDcY0b1NGjf1iEArms2Dw_GMDlIOU5';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already logged in, skip straight to the app
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'index.html';
  })();

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value;
    const btn = document.getElementById('btn-login');
    const msg = document.getElementById('login-msg');

    btn.disabled = true;
    btn.textContent = '登入中 …';
    msg.textContent = '';
    msg.className = 'msg';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = '登入失敗：' + (error.message || '請檢查帳號密碼');
      msg.className = 'msg error';
      btn.disabled = false;
      btn.textContent = '登入';
      return false;
    }

    msg.textContent = '登入成功，正在跳轉 …';
    msg.className = 'msg ok';
    window.location.href = 'index.html';
    return false;
  }
</script>
</body>
</html>
